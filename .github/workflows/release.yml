name: Build XG-040G-MD UBI

on:
  workflow_dispatch:
    inputs:
      config_only:
        description: "仅验证配置，不编译固件。"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: xg040gmd-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout fork master
      # ============================================================

      - name: Checkout fork master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      # ============================================================
      # 2. Sync latest pbs05/ponwrt master before every build
      # ============================================================

      - name: Sync latest upstream PonWrt
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/pbs05/ponwrt.git

          echo "========== Fetch upstream =========="
          git fetch upstream master

          echo "========== Latest upstream commit =========="
          git log -1 --oneline upstream/master

          git checkout master
          git reset --hard upstream/master
          git clean -fdx

          echo "========== Sync fork master =========="
          git push origin HEAD:master --force

          echo "========== Actual build source =========="
          git log -1 --oneline

      # ============================================================
      # 3. Free runner space
      # ============================================================

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      # ============================================================
      # 4. Host build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      # ============================================================
      # 5. Download cache
      # ============================================================

      - name: Prepare download cache
        run: |
          mkdir -p dl

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-xg040gmd-${{ hashFiles('feeds.conf.default', 'configs/an7581.config', 'configs/release.config') }}
          restore-keys: |
            ponwrt-xg040gmd-

      # ============================================================
      # 6. Third-party feeds
      # PassWall2 feeds are deliberately placed first
      # ============================================================

      - name: Configure official PassWall2 and iStore feeds
        shell: bash
        run: |
          set -euo pipefail

          grep -vE \
            '^src-git (passwall_packages|passwall2|istore) ' \
            feeds.conf.default \
            > /tmp/feeds.original

          cat > feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          src-git istore https://github.com/linkease/istore;main
          EOF

          cat /tmp/feeds.original >> feeds.conf.default

          echo "========== Feed order =========="
          head -n 10 feeds.conf.default

          test "$(sed -n '1p' feeds.conf.default)" = \
            "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main"

          test "$(sed -n '2p' feeds.conf.default)" = \
            "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main"

          test "$(sed -n '3p' feeds.conf.default)" = \
            "src-git istore https://github.com/linkease/istore;main"

          echo "Feed priority OK."

      # ============================================================
      # 7. Update/install feeds
      # ============================================================

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 8. Verify package sources
      # ============================================================

      - name: Verify package sources
        shell: bash
        run: |
          set -euo pipefail

          echo "========== iStore =========="
          test -f package/feeds/istore/luci-app-store/Makefile
          echo "iStore source OK."

          echo "========== PassWall2 =========="
          test -f package/feeds/passwall2/luci-app-passwall2/Makefile
          echo "PassWall2 source OK."

          echo "========== PassWall2 packages =========="
          test -f package/feeds/passwall_packages/sing-box/Makefile
          test -f package/feeds/passwall_packages/chinadns-ng/Makefile
          test -f package/feeds/passwall_packages/geoview/Makefile
          test -f package/feeds/passwall_packages/tcping/Makefile
          test -f package/feeds/passwall_packages/v2ray-geodata/Makefile

          echo "PassWall2 package sources OK."

      # ============================================================
      # 9. Signing key
      # ============================================================

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077

            printf '%s\n' \
              "$PONWRT_APK_PRIVATE_KEY" \
              > private-key.pem

            openssl ec \
              -in private-key.pem \
              -pubout \
              -out public-key.pem
          fi

      # ============================================================
      # 10. Default LAN IP + hostname
      # ============================================================

      - name: Set default LAN IP and hostname
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("package/base-files/files/bin/config_generate")
          data = path.read_text()

          replacements = [
              (
                  'lan) ipad=${ipaddr:-"192.168.1.1"} ;;',
                  'lan) ipad=${ipaddr:-"192.168.2.1"} ;;'
              ),
              (
                  "set system.@system[-1].hostname='ponwrt'",
                  "set system.@system[-1].hostname='ImmortalWrt'"
              ),
          ]

          for old, new in replacements:
              count = data.count(old)

              if count != 1:
                  raise SystemExit(
                      f"ERROR: expected exactly one occurrence of {old!r}, "
                      f"found {count}"
                  )

              data = data.replace(old, new, 1)

          path.write_text(data)
          PY

          echo "========== Verify network defaults =========="

          grep -F \
            'lan) ipad=${ipaddr:-"192.168.2.1"} ;;' \
            package/base-files/files/bin/config_generate

          grep -F \
            "set system.@system[-1].hostname='ImmortalWrt'" \
            package/base-files/files/bin/config_generate

          if grep -Fq \
            'lan) ipad=${ipaddr:-"192.168.1.1"} ;;' \
            package/base-files/files/bin/config_generate; then
            echo "ERROR: old LAN IP still exists."
            exit 1
          fi

          if grep -Fq \
            "set system.@system[-1].hostname='ponwrt'" \
            package/base-files/files/bin/config_generate; then
            echo "ERROR: old hostname still exists."
            exit 1
          fi

          echo "LAN default = 192.168.2.1"
          echo "Hostname default = ImmortalWrt"

      # ============================================================
      # 11. Branding
      # ============================================================

      - name: Set Argon brand to ImmortalWrt
        shell: bash
        run: |
          set -euo pipefail

          header="feeds/luci/themes/luci-theme-argon/ucode/template/themes/argon/header.ut"

          test -f "$header"

          if grep -q '{{ hostname }}' "$header"; then
            sed -i 's/{{ hostname }}/ImmortalWrt/g' "$header"
          fi

          grep -q 'ImmortalWrt' "$header"

      - name: Set firmware brand to ImmortalWrt
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("include/version.mk")
          data = path.read_text()

          old = "VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),PonWrt)"
          new = "VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),ImmortalWrt)"

          if old in data:
              data = data.replace(old, new, 1)
              path.write_text(data)

          data = path.read_text()

          if new not in data:
              raise SystemExit("ERROR: VERSION_DIST was not set to ImmortalWrt")
          PY

          grep 'VERSION_DIST:=' include/version.mk

      # ============================================================
      # 12. Custom configuration
      # ============================================================

      - name: Create XG-040G-MD custom config
        run: |
          cat > /tmp/xg040gmd.config <<'EOF'

          # ========================================================
          # DEVICE - Nokia XG-040G-MD UBI ONLY
          # ========================================================

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-eagle is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-kite is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_w1700k-ubi is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_xg2010g is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_valyrian is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-cu is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-tf-ubi is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn504xg-d is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn515xg-d is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_quantum_q1000k-ubi is not set

          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y

          # ========================================================
          # OPENCLASH DISABLED
          # ========================================================

          # CONFIG_PACKAGE_luci-app-openclash is not set

          # ========================================================
          # PASSWALL V1 DISABLED
          # ========================================================

          # CONFIG_PACKAGE_luci-app-passwall is not set

          # ========================================================
          # ISTORE
          # ========================================================

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_xz-utils=y

          # ========================================================
          # WIREGUARD
          # ========================================================

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          # ========================================================
          # PASSWALL2 - SingBox only + nftables
          # ========================================================

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y

          # Basic core

          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray is not set
          CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_SingBox=y
          # CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All is not set

          # Transparent proxy

          # CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy is not set
          CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y

          # Disable optional heavy / legacy components

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy is not set

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server is not set

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server is not set

          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs is not set
          # CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin is not set

          # ========================================================
          # SAMBA
          # ========================================================

          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y

          EOF

      # ============================================================
      # 13. Merge configuration
      # ============================================================

      - name: Configure XG-040G-MD
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/kconfig.pl + \
            configs/an7581.config \
            + \
            configs/release.config \
            /tmp/xg040gmd.config \
            > .config

          make defconfig

      # ============================================================
      # 14. Strict configuration verification
      # ============================================================

      - name: Verify final configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TARGET"
          echo "=========================================="

          grep \
            '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' \
            .config

          target_count="$(
            grep -c \
              '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' \
              .config
          )"

          if [ "$target_count" -ne 1 ]; then
            echo "ERROR: expected exactly one AN7581 device."
            echo "Found: ${target_count}"
            exit 1
          fi

          grep -q \
            '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y$' \
            .config

          echo "Target OK."

          echo "=========================================="
          echo "OPENCLASH"
          echo "=========================================="

          if grep -q \
            '^CONFIG_PACKAGE_luci-app-openclash=y$' \
            .config; then
            echo "ERROR: OpenClash is enabled."
            exit 1
          fi

          echo "OpenClash disabled."

          echo "=========================================="
          echo "ISTORE"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_luci-app-store=y$' .config
          grep '^CONFIG_PACKAGE_xz-utils=y$' .config

          echo "iStore OK."

          echo "=========================================="
          echo "WIREGUARD"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_kmod-wireguard=y$' .config
          grep '^CONFIG_PACKAGE_wireguard-tools=y$' .config
          grep '^CONFIG_PACKAGE_luci-proto-wireguard=y$' .config

          grep '^CONFIG_PACKAGE_luci-lib-uqr=y$' .config
          grep '^CONFIG_PACKAGE_resolveip=y$' .config

          echo "WireGuard OK."

          echo "=========================================="
          echo "PASSWALL2"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_luci-app-passwall2=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y$' .config

          grep \
            '^CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_SingBox=y$' \
            .config

          grep '^CONFIG_PACKAGE_sing-box=y$' .config

          grep \
            '^CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y$' \
            .config

          echo "PassWall2 + SingBox + nftables selected."

          echo "=========================================="
          echo "PASSWALL2 DISABLED OPTIONS"
          echo "=========================================="

          for option in \
            CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray \
            CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All \
            CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Client \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Shadowsocks_Rust_Server \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Client \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_ShadowsocksR_Libev_Server \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Simple_Obfs \
            CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_V2ray_Plugin
          do
            if grep -q "^${option}=y$" .config; then
              echo "ERROR: unexpected PassWall2 option enabled:"
              echo "${option}"
              exit 1
            fi
          done

          echo "PassWall2 unwanted components disabled."

          echo "=========================================="
          echo "PASSWALL2 DEPENDENCIES"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_coreutils=y$' .config
          grep '^CONFIG_PACKAGE_coreutils-base64=y$' .config
          grep '^CONFIG_PACKAGE_coreutils-nohup=y$' .config
          grep '^CONFIG_PACKAGE_coreutils-timeout=y$' .config

          grep '^CONFIG_PACKAGE_curl=y$' .config
          grep '^CONFIG_PACKAGE_ip-full=y$' .config

          grep '^CONFIG_PACKAGE_libuci-lua=y$' .config
          grep '^CONFIG_PACKAGE_lua=y$' .config

          grep '^CONFIG_PACKAGE_luci-compat=y$' .config
          grep '^CONFIG_PACKAGE_luci-lib-jsonc=y$' .config

          grep '^CONFIG_PACKAGE_lyaml=y$' .config
          grep '^CONFIG_PACKAGE_resolveip=y$' .config
          grep '^CONFIG_PACKAGE_tcping=y$' .config
          grep '^CONFIG_PACKAGE_geoview=y$' .config

          grep '^CONFIG_PACKAGE_v2ray-geoip=y$' .config
          grep '^CONFIG_PACKAGE_v2ray-geosite=y$' .config

          grep '^CONFIG_PACKAGE_unzip=y$' .config

          echo "PassWall2 dependencies OK."

          echo "=========================================="
          echo "FIREWALL4 / NFTABLES"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_firewall4=y$' .config

          grep '^CONFIG_PACKAGE_chinadns-ng=y$' .config

          grep '^CONFIG_PACKAGE_dnsmasq-full=y$' .config
          grep '^CONFIG_PACKAGE_dnsmasq_full_nftset=y$' .config

          # PonWrt/ImmortalWrt current nftables package
          grep '^CONFIG_PACKAGE_nftables-json=y$' .config

          grep '^CONFIG_PACKAGE_kmod-nft-socket=y$' .config
          grep '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config
          grep '^CONFIG_PACKAGE_kmod-nft-nat=y$' .config

          echo "Firewall4 / nftables OK."

          echo "=========================================="
          echo "PON"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_kmod-airoha-pon-frontend=y$' .config
          grep '^CONFIG_PACKAGE_kmod-airoha-xpon=y$' .config

          grep '^CONFIG_PACKAGE_airoha-pon-debug=y$' .config
          grep '^CONFIG_PACKAGE_airoha-ponctl=y$' .config
          grep '^CONFIG_PACKAGE_airoha-pond=y$' .config

          grep '^CONFIG_PACKAGE_luci-app-pon=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-pon-zh-cn=y$' .config

          echo "PON OK."

          echo "=========================================="
          echo "SAMBA"
          echo "=========================================="

          grep '^CONFIG_PACKAGE_samba4-server=y$' .config
          grep '^CONFIG_PACKAGE_luci-app-samba4=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y$' .config

          echo "Samba OK."

          echo "=========================================="
          echo "SIMPLIFIED CHINESE"
          echo "=========================================="

          grep '^CONFIG_LUCI_LANG_zh_Hans=y$' .config

          grep '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-pon-zh-cn=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y$' .config

          echo "Simplified Chinese OK."

          echo "=========================================="
          echo "DEFAULT IP / HOSTNAME"
          echo "=========================================="

          grep -F \
            'lan) ipad=${ipaddr:-"192.168.2.1"} ;;' \
            package/base-files/files/bin/config_generate

          grep -F \
            "set system.@system[-1].hostname='ImmortalWrt'" \
            package/base-files/files/bin/config_generate

          echo "192.168.2.1 / ImmortalWrt OK."

          echo "=========================================="
          echo "ALL PRE-BUILD CHECKS PASSED"
          echo "=========================================="

      # ============================================================
      # 15. Config-only test mode
      # ============================================================

      - name: Upload build config
        if: ${{ inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-build-config
          path: .config
          include-hidden-files: true
          retention-days: 7

      # ============================================================
      # 16. Download sources
      # ============================================================

      - name: Download sources
        if: ${{ !inputs.config_only }}
        run: |
          make download -j"$(nproc)"

      # ============================================================
      # 17. Build
      # ============================================================

      - name: Build firmware
        if: ${{ !inputs.config_only }}
        run: |
          make -j"$(nproc)"

      # ============================================================
      # 18. Verify actual firmware manifest
      # ============================================================

      - name: Verify firmware package manifest
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          target_dir="bin/targets/airoha/an7581"

          echo "========== Target output =========="
          ls -lah "$target_dir"

          mapfile -t manifests < <(
            find "$target_dir" \
              -maxdepth 1 \
              -type f \
              -name '*.manifest' \
              -print
          )

          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one device manifest."
            echo "Found ${#manifests[@]}."
            printf '%s\n' "${manifests[@]}"
            exit 1
          fi

          manifest="${manifests[0]}"

          echo "========== Manifest =========="
          echo "$manifest"

          for pkg in \
            luci-app-store \
            kmod-wireguard \
            wireguard-tools \
            luci-proto-wireguard \
            luci-app-passwall2 \
            sing-box \
            chinadns-ng \
            luci-app-pon \
            airoha-ponctl \
            airoha-pond \
            samba4-server
          do
            if ! grep -q "^${pkg} " "$manifest"; then
              echo "ERROR: firmware manifest is missing package: ${pkg}"
              exit 1
            fi
          done

          if grep -q '^luci-app-openclash ' "$manifest"; then
            echo "ERROR: OpenClash unexpectedly exists in firmware."
            exit 1
          fi

          echo "Actual firmware package manifest OK."

      # ============================================================
      # 19. Collect exactly one sysupgrade.itb
      # ============================================================

      - name: Collect XG-040G-MD firmware
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          target_dir="bin/targets/airoha/an7581"

          mapfile -t firmware_files < <(
            find "$target_dir" \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          echo "========== sysupgrade.itb candidates =========="
          printf '%s\n' "${firmware_files[@]}"

          if [ "${#firmware_files[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one sysupgrade.itb."
            echo "Found ${#firmware_files[@]}."
            exit 1
          fi

          firmware="${firmware_files[0]}"

          if [ ! -s "$firmware" ]; then
            echo "ERROR: firmware is empty."
            exit 1
          fi

          cp -v "$firmware" release/

      # ============================================================
      # 20. Final firmware validation
      # ============================================================

      - name: Verify final firmware
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t final_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          if [ "${#final_files[@]}" -ne 1 ]; then
            echo "ERROR: release directory must contain exactly one ITB."
            exit 1
          fi

          firmware="${final_files[0]}"

          test -s "$firmware"

          echo "========== Final firmware =========="
          ls -lh "$firmware"

          echo "========== SHA256 =========="
          sha256sum "$firmware"

      # ============================================================
      # 21. Publish raw ITB to GitHub Release
      # ============================================================

      - name: Publish raw ITB to GitHub Release
        if: ${{ !inputs.config_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t firmware_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          if [ "${#firmware_files[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one firmware."
            exit 1
          fi

          firmware="${firmware_files[0]}"

          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"

          release_tag="xg040gmd-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"

          firmware_sha256="$(
            sha256sum "$firmware" | awk '{print $1}'
          )"

          echo "========== Release =========="
          echo "Tag: ${release_tag}"
          echo "Source: ${source_sha}"
          echo "Firmware: ${firmware}"
          echo "SHA256: ${firmware_sha256}"

          gh release create \
            "${release_tag}" \
            "${firmware}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${source_sha}" \
            --title "Nokia XG-040G-MD ${short_sha}" \
            --notes "Nokia XG-040G-MD UBI sysupgrade firmware.

          Default LAN IP: 192.168.2.1
          Default hostname: ImmortalWrt

          Proxy:
          PassWall2 + SingBox + nftables

          VPN:
          WireGuard

          OpenClash:
          Not included

          Source commit: ${source_sha}

          SHA256:
          ${firmware_sha256}" \
            --prerelease

      # ============================================================
      # 22. Verify published Release
      # ============================================================

      - name: Verify published Release
        if: ${{ !inputs.config_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=8 HEAD)"
          release_tag="xg040gmd-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"

          asset_count="$(
            gh release view \
              "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets | length'
          )"

          if [ "${asset_count}" -ne 1 ]; then
            echo "ERROR: Release must contain exactly one uploaded asset."
            echo "Found: ${asset_count}"
            exit 1
          fi

          asset_name="$(
            gh release view \
              "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[0].name'
          )"

          case "${asset_name}" in
            *sysupgrade.itb)
              ;;
            *)
              echo "ERROR: Release asset is not sysupgrade.itb."
              echo "Asset: ${asset_name}"
              exit 1
              ;;
          esac

          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "Raw firmware: ${asset_name}"
          echo "=========================================="
