name: Build XG-040G-MD UBI

on:
  workflow_dispatch:
    inputs:
      config_only:
        description: "仅验证配置，不编译固件。"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: xg040gmd-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. Checkout fork master
      # ============================================================

      - name: Checkout fork master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      # ============================================================
      # 2. Force sync latest upstream source before every build
      # ============================================================

      - name: Sync latest upstream PonWrt
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/pbs05/ponwrt.git

          echo "========== Fetch upstream =========="
          git fetch upstream master

          echo "========== Upstream latest commit =========="
          git log -1 --oneline upstream/master

          git checkout master
          git reset --hard upstream/master

          echo "========== Sync fork master =========="
          git push origin HEAD:master --force

          echo "========== Build source =========="
          git log -1 --oneline

      # ============================================================
      # 3. Free disk space
      # ============================================================

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      # ============================================================
      # 4. Install build dependencies
      # ============================================================

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      # ============================================================
      # 5. Cache
      # ============================================================

      - name: Prepare download cache directory
        run: |
          mkdir -p dl

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-xg040gmd-${{ hashFiles('feeds.conf.default', 'configs/an7581.config', 'configs/release.config') }}
          restore-keys: |
            ponwrt-xg040gmd-

      # ============================================================
      # 6. Add official iStore feed
      # ============================================================

      - name: Add iStore official feed
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q '^src-git istore ' feeds.conf.default; then
            echo '' >> feeds.conf.default
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          fi

          grep '^src-git istore ' feeds.conf.default

      # ============================================================
      # 7. Install all upstream feeds first
      # ============================================================

      - name: Install feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # 8. Install iStore
      # ============================================================

      - name: Install iStore
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds install \
            -d y \
            -p istore \
            luci-app-store

          echo "========== iStore package check =========="

          test -f package/feeds/istore/luci-app-store/Makefile

          echo "luci-app-store package found."

      # ============================================================
      # 9. Replace feed OpenClash with latest official OpenClash
      # ============================================================

      - name: Add latest official OpenClash
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/OpenClash

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          git -C /tmp/OpenClash \
            sparse-checkout set luci-app-openclash

          echo "========== OpenClash latest commit =========="
          git -C /tmp/OpenClash log -1 --oneline

          echo "========== OpenClash version =========="
          grep '^PKG_VERSION:=' \
            /tmp/OpenClash/luci-app-openclash/Makefile

          # Remove ImmortalWrt feed copy to avoid duplicate package definition
          rm -rf package/feeds/luci/luci-app-openclash

          # Remove previous local copy
          rm -rf package/luci-app-openclash

          # Install latest official OpenClash as local/core package
          cp -a \
            /tmp/OpenClash/luci-app-openclash \
            package/luci-app-openclash

          test -f package/luci-app-openclash/Makefile

      # ============================================================
      # 10. Verify OpenClash dependencies actually exist in package tree
      # ============================================================

      - name: Verify OpenClash dependency packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========== OpenClash dependency package tree =========="

          test -f package/feeds/luci/luci-compat/Makefile
          echo "luci-compat OK"

          test -e package/feeds/packages/bash
          echo "bash OK"

          test -e package/feeds/packages/curl
          echo "curl OK"

          test -e package/feeds/packages/ruby
          echo "ruby OK"

          test -e package/feeds/packages/unzip
          echo "unzip OK"

          echo "OpenClash dependency package tree OK."

      # ============================================================
      # 11. Repository signing key
      # ============================================================

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077

            printf '%s\n' \
              "$PONWRT_APK_PRIVATE_KEY" \
              > private-key.pem

            openssl ec \
              -in private-key.pem \
              -pubout \
              -out public-key.pem
          fi

      # ============================================================
      # 12. Branding
      # ============================================================

      - name: Set Argon brand to ImmortalWrt
        run: |
          sed -i \
            's/{{ hostname }}/ImmortalWrt/g' \
            feeds/luci/themes/luci-theme-argon/ucode/template/themes/argon/header.ut

          grep 'class="brand"' \
            feeds/luci/themes/luci-theme-argon/ucode/template/themes/argon/header.ut

      - name: Set firmware brand to ImmortalWrt
        run: |
          sed -i \
            's/VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),PonWrt)/VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),ImmortalWrt)/' \
            include/version.mk

          grep 'VERSION_DIST:=' \
            include/version.mk

      # ============================================================
      # 13. XG-040G-MD single-device custom config
      # ============================================================

      - name: Create XG-040G-MD custom config
        run: |
          cat > /tmp/xg040gmd.config <<'EOF'

          # --------------------------------------------------------
          # Only build Nokia XG-040G-MD UBI
          # --------------------------------------------------------

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-eagle is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-kite is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_w1700k-ubi is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_xg2010g is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_valyrian is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-cu is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-tf-ubi is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn504xg-d is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn515xg-d is not set

          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_quantum_q1000k-ubi is not set

          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y

          # --------------------------------------------------------
          # iStore
          # --------------------------------------------------------

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_xz-utils=y

          # --------------------------------------------------------
          # OpenClash
          # --------------------------------------------------------

          CONFIG_PACKAGE_luci-app-openclash=y

          # Critical LuCI compatibility package.
          # Provides /usr/lib/lua/luci/cbi/datatypes.lua
          CONFIG_PACKAGE_luci-compat=y

          # OpenClash hard runtime dependencies
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_unzip=y

          # OpenClash runtime helper dependencies
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # --------------------------------------------------------
          # Samba
          # --------------------------------------------------------

          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y

          EOF

      # ============================================================
      # 14. Generate final config
      # ============================================================

      - name: Configure XG-040G-MD
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/kconfig.pl + \
            configs/an7581.config \
            + \
            configs/release.config \
            /tmp/xg040gmd.config \
            > .config

          make defconfig

      # ============================================================
      # 15. Strict pre-build verification
      # ============================================================

      - name: Verify target and packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Target =========="

          grep \
            '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' \
            .config

          target_count="$(
            grep -c \
              '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' \
              .config
          )"

          if [ "$target_count" -ne 1 ]; then
            echo "ERROR: Expected exactly one AN7581 device."
            echo "ERROR: Found ${target_count}."
            exit 1
          fi

          grep -q \
            '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y$' \
            .config

          echo "XG-040G-MD target OK."

          echo "========== iStore =========="

          grep '^CONFIG_PACKAGE_luci-app-store=y$' .config
          grep '^CONFIG_PACKAGE_xz-utils=y$' .config

          echo "iStore OK."

          echo "========== OpenClash =========="

          grep '^CONFIG_PACKAGE_luci-app-openclash=y$' .config

          echo "========== OpenClash runtime dependencies =========="

          grep '^CONFIG_PACKAGE_luci-compat=y$' .config
          grep '^CONFIG_PACKAGE_dnsmasq-full=y$' .config
          grep '^CONFIG_PACKAGE_bash=y$' .config
          grep '^CONFIG_PACKAGE_curl=y$' .config
          grep '^CONFIG_PACKAGE_ca-bundle=y$' .config
          grep '^CONFIG_PACKAGE_ip-full=y$' .config
          grep '^CONFIG_PACKAGE_ruby=y$' .config
          grep '^CONFIG_PACKAGE_ruby-yaml=y$' .config
          grep '^CONFIG_PACKAGE_kmod-tun=y$' .config
          grep '^CONFIG_PACKAGE_unzip=y$' .config
          grep '^CONFIG_PACKAGE_kmod-inet-diag=y$' .config
          grep '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config

          echo "OpenClash and dependencies OK."

          echo "========== Samba =========="

          grep '^CONFIG_PACKAGE_samba4-server=y$' .config
          grep '^CONFIG_PACKAGE_luci-app-samba4=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y$' .config

          echo "Samba OK."

          echo "========== PON =========="

          grep '^CONFIG_PACKAGE_kmod-airoha-pon-frontend=y$' .config
          grep '^CONFIG_PACKAGE_kmod-airoha-xpon=y$' .config
          grep '^CONFIG_PACKAGE_airoha-pon-debug=y$' .config
          grep '^CONFIG_PACKAGE_airoha-ponctl=y$' .config
          grep '^CONFIG_PACKAGE_airoha-pond=y$' .config
          grep '^CONFIG_PACKAGE_luci-app-pon=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-pon-zh-cn=y$' .config

          echo "PON OK."

          echo "========== Simplified Chinese =========="

          grep '^CONFIG_LUCI_LANG_zh_Hans=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-pon-zh-cn=y$' .config

          echo "Simplified Chinese OK."

          echo "=========================================="
          echo "ALL REQUIRED CONFIGS VERIFIED."
          echo "=========================================="

      # ============================================================
      # 16. Config-only mode
      # ============================================================

      - name: Upload build config
        if: ${{ inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-build-config
          path: .config
          include-hidden-files: true
          retention-days: 7

      # ============================================================
      # 17. Download sources
      # ============================================================

      - name: Download sources
        if: ${{ !inputs.config_only }}
        run: |
          make download -j"$(nproc)"

      # ============================================================
      # 18. Build
      # ============================================================

      - name: Build firmware
        if: ${{ !inputs.config_only }}
        run: |
          make -j"$(nproc)"

      # ============================================================
      # 19. Find exactly one sysupgrade.itb
      # ============================================================

      - name: Collect XG-040G-MD sysupgrade firmware
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          target_dir="bin/targets/airoha/an7581"

          echo "========== Generated target files =========="

          ls -lah "$target_dir"

          echo "========== Find sysupgrade.itb =========="

          mapfile -t firmware_files < <(
            find "$target_dir" \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          printf '%s\n' "${firmware_files[@]}"

          echo "Found ${#firmware_files[@]} sysupgrade.itb file(s)."

          if [ "${#firmware_files[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly ONE sysupgrade.itb."
            echo "ERROR: Found ${#firmware_files[@]}."
            exit 1
          fi

          firmware="${firmware_files[0]}"

          if [ ! -s "$firmware" ]; then
            echo "ERROR: Generated firmware is empty."
            exit 1
          fi

          cp -v \
            "$firmware" \
            release/

      # ============================================================
      # 20. Final local verification
      # ============================================================

      - name: Verify final firmware
        if: ${{ !inputs.config_only }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Final release directory =========="

          ls -lah release/

          mapfile -t final_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          if [ "${#final_files[@]}" -ne 1 ]; then
            echo "ERROR: Release directory must contain exactly one ITB."
            exit 1
          fi

          test -s "${final_files[0]}"

          echo "========== Firmware SHA256 =========="

          sha256sum "${final_files[0]}"

          echo "=========================================="
          echo "Exactly one valid sysupgrade.itb is ready."
          echo "=========================================="

      # ============================================================
      # 21. Publish raw ITB directly to GitHub Release
      # ============================================================

      - name: Publish ITB directly to GitHub Release
        if: ${{ !inputs.config_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t firmware_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              -name '*sysupgrade.itb' \
              -print
          )

          if [ "${#firmware_files[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release firmware."
            exit 1
          fi

          firmware="${firmware_files[0]}"

          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"

          release_tag="xg040gmd-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"

          firmware_sha256="$(
            sha256sum "$firmware" | awk '{print $1}'
          )"

          echo "========== Release =========="
          echo "Tag: ${release_tag}"
          echo "Source: ${source_sha}"
          echo "Firmware: ${firmware}"
          echo "SHA256: ${firmware_sha256}"
          echo "============================="

          gh release create \
            "${release_tag}" \
            "${firmware}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${source_sha}" \
            --title "Nokia XG-040G-MD ${short_sha}" \
            --notes "Nokia XG-040G-MD UBI sysupgrade firmware.

          Source commit: ${source_sha}

          SHA256: ${firmware_sha256}" \
            --prerelease

      # ============================================================
      # 22. Verify GitHub Release contains exactly one raw ITB
      # ============================================================

      - name: Verify published Release
        if: ${{ !inputs.config_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=8 HEAD)"
          release_tag="xg040gmd-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"

          echo "========== Published Release =========="

          gh release view \
            "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,assets

          asset_count="$(
            gh release view \
              "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets | length'
          )"

          if [ "${asset_count}" -ne 1 ]; then
            echo "ERROR: Release must contain exactly ONE asset."
            echo "ERROR: Found ${asset_count}."
            exit 1
          fi

          asset_name="$(
            gh release view \
              "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[0].name'
          )"

          case "${asset_name}" in
            *sysupgrade.itb)
              ;;
            *)
              echo "ERROR: Release asset is not a sysupgrade.itb."
              echo "Asset: ${asset_name}"
              exit 1
              ;;
          esac

          echo "=========================================="
          echo "Release successfully published."
          echo "Raw ITB: ${asset_name}"
          echo "=========================================="
