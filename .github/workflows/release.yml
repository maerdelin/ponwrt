name: Build XG-040G-MD UBI

on:
  workflow_dispatch:
    inputs:
      config_only:
        description: "仅输出配置文件，不编译固件。"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build Nokia XG-040G-MD UBI
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout latest upstream mirror
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-xg040gmd-${{ hashFiles('feeds.conf.default', 'configs/an7581.config', 'configs/release.config') }}
          restore-keys: |
            ponwrt-xg040gmd-

      - name: Add iStore official feed
        run: |
          if ! grep -q '^src-git istore ' feeds.conf.default; then
            echo '' >> feeds.conf.default
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          fi

      - name: Add OpenClash
        run: |
          rm -rf /tmp/OpenClash
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash
          git -C /tmp/OpenClash sparse-checkout set luci-app-openclash
          rm -rf package/luci-app-openclash
          cp -a /tmp/OpenClash/luci-app-openclash package/

      - name: Install feeds and iStore
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          ./scripts/feeds install -d y -p istore luci-app-store

          echo "========== iStore PACKAGE CHECK =========="

          if [ ! -f "./package/feeds/istore/luci-app-store/Makefile" ]; then
            echo "ERROR: luci-app-store was not installed into package tree!"
            find ./package ./feeds \
              -iname '*istore*' \
              -o -iname '*luci-app-store*' \
              2>/dev/null || true
            exit 1
          fi

          echo "luci-app-store package found."
          echo "=========================================="

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Set Argon brand to ImmortalWrt
        run: |
          sed -i 's/{{ hostname }}/ImmortalWrt/g' \
            feeds/luci/themes/luci-theme-argon/ucode/template/themes/argon/header.ut

          grep 'class="brand"' \
            feeds/luci/themes/luci-theme-argon/ucode/template/themes/argon/header.ut

      - name: Set firmware brand to ImmortalWrt
        run: |
          sed -i \
            's/VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),PonWrt)/VERSION_DIST:=$(if $(VERSION_DIST),$(VERSION_DIST),ImmortalWrt)/' \
            include/version.mk

          grep 'VERSION_DIST:=' include/version.mk

      - name: Create XG-040G-MD custom config
        run: |
          cat > /tmp/xg040gmd.config <<'EOF'
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-eagle is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_airoha_an7581-evb-emmc-kite is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_w1700k-ubi is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_gemtek_xg2010g is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_valyrian is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-cu is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-tf-ubi is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_unionman_ung00a is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn504xg-d is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn515xg-d is not set
          # CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_quantum_q1000k-ubi is not set

          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_samba4-server=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y
          EOF

      - name: Configure XG-040G-MD
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            + \
            configs/release.config \
            /tmp/xg040gmd.config > .config

          make defconfig

      - name: Verify target and packages
        run: |
          echo "========== Target =========="

          grep '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config

          test "$(grep -c '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config)" -eq 1

          grep -q \
            '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y$' \
            .config

          echo "========== iStore =========="

          if ! grep -q '^CONFIG_PACKAGE_luci-app-store=y$' .config; then
            echo "ERROR: luci-app-store is missing from final .config!"

            echo "========== iStore .config =========="
            grep -i 'istore\|luci-app-store' .config || true

            echo "========== iStore Kconfig =========="
            grep -n -A20 -B5 \
              'PACKAGE_luci-app-store' \
              tmp/.config-package.in \
              2>/dev/null || true

            echo "========== iStore package metadata =========="
            grep -Rni \
              'luci-app-store' \
              tmp/.packageinfo* \
              2>/dev/null | head -50 || true

            exit 1
          fi

          grep '^CONFIG_PACKAGE_luci-app-store=y$' .config
          echo "iStore config OK."

          echo "========== OpenClash =========="
          grep '^CONFIG_PACKAGE_luci-app-openclash=y$' .config

          echo "========== Samba =========="
          grep '^CONFIG_PACKAGE_samba4-server=y$' .config
          grep '^CONFIG_PACKAGE_luci-app-samba4=y$' .config
          grep '^CONFIG_PACKAGE_luci-i18n-samba4-zh-cn=y$' .config

      - name: Upload build config
        if: ${{ inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: xg040gmd-build-config
          path: .config
          retention-days: 7

      - name: Download sources
        if: ${{ !inputs.config_only }}
        run: |
          make download -j"$(nproc)"

      - name: Build firmware
        if: ${{ !inputs.config_only }}
        run: |
          make -j"$(nproc)"

      - name: Collect sysupgrade.itb only
        if: ${{ !inputs.config_only }}
        run: |
          mkdir -p release

          find bin/targets/airoha/an7581/ \
            -maxdepth 1 \
            -type f \
            -name '*nokia_xg-040g-md-ubi-sysupgrade.itb' \
            -exec cp -v {} release/ \;

      - name: Verify firmware
        if: ${{ !inputs.config_only }}
        run: |
          echo "Generated firmware:"
          ls -lh release/

          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 1

          test -n "$(find release \
            -maxdepth 1 \
            -type f \
            -name '*nokia_xg-040g-md-ubi-sysupgrade.itb' \
            -print -quit)"

      - name: Upload sysupgrade.itb
        if: ${{ !inputs.config_only }}
        uses: actions/upload-artifact@v4
        with:
          name: nokia-xg-040g-md-ubi-sysupgrade
          path: release/*nokia_xg-040g-md-ubi-sysupgrade.itb
          if-no-files-found: error
          retention-days: 7
